<title>LORDVER</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#343238 0,#17171b 55%,#09090b 100%);font-family:Arial,Helvetica,sans-serif;color:#f4f4f4}.panel{width:min(92vw,720px);padding:clamp(28px,6vw,64px);border:2px solid #77706a;background:linear-gradient(145deg,#29282b,#111114);box-shadow:0 18px 70px #000b,inset 0 0 0 5px #171619;position:relative;text-align:center}.panel:before,.panel:after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(135deg,#f5b51b 0 16px,#252326 16px 32px)}.panel:before{top:0}.panel:after{bottom:0}.eyebrow{color:#f5b51b;font-weight:800;letter-spacing:.28em;font-size:12px}.logo{font-size:clamp(42px,9vw,78px);font-weight:1000;font-style:italic;line-height:.95;letter-spacing:-.06em;text-shadow:4px 4px 0 #9d5c09;margin:20px 0}.logo span{color:#ffc21c}.rule{height:1px;background:#625b52;margin:28px auto;max-width:420px}.label{color:#aaa;font-size:13px;letter-spacing:.18em;text-transform:uppercase}.version{display:inline-block;margin-top:12px;padding:10px 22px;border:1px solid #e6a817;color:#ffc21c;font-weight:800;font-size:24px;background:#171517}.foot{margin-top:30px;color:#777;font-size:12px}
</style>
</head>
<body><main class="panel"><div class="eyebrow">CLASSIC OFFENSIVE</div><h1 class="logo">LORD OF <span>STRIKE</span></h1><div class="rule"></div><div class="label">Текущая версия игры</div><div class="version" id="version">1.4.5</div><div class="foot">LORDVER · Официальная страница версии</div></main></body>
